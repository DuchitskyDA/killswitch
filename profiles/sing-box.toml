# sing-box (CLI): TUN без interface_name — tun<N>, на macOS — utun<N>.
name = "sing-box"
description = "sing-box: адаптер sing-tun Tunnel / tun<N> / utun<N>"

# Живые проверки: Linux — лаборатория в network namespace (lab/), сценарии 1–10 v4/v6 с этим профилем
# (TUN tun0/tun1, ядро от root). С auto_redirect — с ограничениями (README). Windows и macOS с этим профилем
# вживую не проверялись.
verified_on = [
  { os = "linux", backend = "nftables", client_version = "1.14.4", date = "2026-11-10" },
]

[windows]
# Описание адаптера sing-tun; программу (sing-box.exe) задайте в конфиге: [[trust]] kind = "program".
interfaces = ["sing-tun Tunnel*"]

[linux]
interfaces = ["tun*"]
users = ["root"]
detect = ["/usr/bin/sing-box"]

[darwin]
interfaces = ["utun*"]
users = ["root"]
detect = ["/opt/homebrew/bin/sing-box", "/usr/local/bin/sing-box"]
