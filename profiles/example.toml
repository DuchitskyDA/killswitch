# Пример формата профиля; профили клиентов добавляет тикет ks-profiles.
name = "example"
description = "Пример: WireGuard с адаптером wg-example"

# Живые проверки; пусто — профиль не проверен.
verified_on = []

[windows]
interfaces = ["wg-example"]
programs = ['C:\Program Files\WireGuard\wireguard.exe']
repair_programs = ['C:\Program Files\WireGuard\wireguard.exe']
detect = ['C:\Program Files\WireGuard\wireguard.exe']

[linux]
interfaces = ["wg-example"]
users = ["root"]
detect = ["/usr/bin/wg"]

[darwin]
interfaces = ["utun-example"]
users = ["root"]
detect = ["/Applications/WireGuard.app"]
