# WireGuard: адаптер называется по имени туннеля.
name = "wireguard"
description = "WireGuard: адаптер WireGuard Tunnel / wg* / utun*"

verified_on = []

[windows]
interfaces = ["WireGuard Tunnel*"]
programs = ['C:\Program Files\WireGuard\wireguard.exe']
detect = ['C:\Program Files\WireGuard\wireguard.exe']

[linux]
# Имя интерфейса = имя конфига wg-quick; другое имя задайте в конфиге: [tunnel] interfaces.
interfaces = ["wg*"]
# wg-quick ставит fwmark 51820 при Table=auto и маршруте 0/0 (если таблица занята — следующий номер).
marks = ["0xca6c"]
detect = ["/usr/bin/wg-quick"]

[darwin]
interfaces = ["utun*"]
users = ["root"]
detect = ["/opt/homebrew/bin/wg-quick", "/usr/local/bin/wg-quick"]
