name: spike-pf

# Спайк pf-бэкенда на одноразовых macOS-раннерах. Правила pf ставятся только здесь, на ВМ раннера.
on:
  push:
    branches: [universal-spike-pf]
    paths: ['spike/pf/**', '.github/workflows/spike-pf.yml']

permissions:
  contents: read

concurrency:
  group: spike-pf
  cancel-in-progress: true

jobs:
  pf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: stage
        timeout-minutes: 2
        run: |
          sudo mkdir -p /private/tmp/ks
          sudo cp spike/pf/*.sh spike/pf/*.py /private/tmp/ks/ 2>/dev/null || sudo cp spike/pf/*.sh /private/tmp/ks/
          sudo chmod -R a+rX /private/tmp/ks
          echo "PY=$(command -v python3)" >> "$GITHUB_ENV"

      - name: setup users
        timeout-minutes: 2
        run: sudo env SUDO_USER="$USER" sh /private/tmp/ks/setup.sh

      - name: inventory
        timeout-minutes: 3
        run: sudo env SUDO_USER="$USER" sh /private/tmp/ks/inventory.sh

      - name: watchdog self-test
        timeout-minutes: 2
        continue-on-error: true
        run: sudo sh /private/tmp/ks/wdtest.sh

      - name: reset
        if: always()
        timeout-minutes: 2
        run: sudo sh -c '. /private/tmp/ks/lib.sh; reset_all final; disarm_watchdog; pfctl -s info | head -3; pfctl -s References'

      - name: results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            sudo cat /private/tmp/ks/out/results.txt 2>/dev/null || echo 'нет результатов'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sudo cat /private/tmp/ks/out/results.txt 2>/dev/null || true
          mkdir -p out && sudo cp -R /private/tmp/ks/out/. out/ && sudo chown -R "$USER" out

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spike-pf-${{ matrix.os }}
          path: out/
