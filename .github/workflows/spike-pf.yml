name: spike-pf

# Спайк pf-бэкенда на одноразовых macOS-раннерах. Правила pf ставятся только здесь, на ВМ раннера.
on:
  push:
    branches: [universal-spike-pf]
    paths: ['spike/pf/**', '.github/workflows/spike-pf.yml']

permissions:
  contents: read

concurrency:
  group: spike-pf
  cancel-in-progress: true

jobs:
  pf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: stage
        timeout-minutes: 2
        run: |
          sudo mkdir -p /private/tmp/ks
          sudo cp spike/pf/*.sh spike/pf/*.py /private/tmp/ks/
          sudo chmod -R a+rX /private/tmp/ks
          echo "PY=$(command -v python3)" >> "$GITHUB_ENV"

      - name: setup users
        timeout-minutes: 2
        run: sudo env SUDO_USER="$USER" sh /private/tmp/ks/setup.sh

      - name: inventory
        timeout-minutes: 3
        run: sudo env SUDO_USER="$USER" sh /private/tmp/ks/inventory.sh

      - name: watchdog self-test
        timeout-minutes: 2
        continue-on-error: true
        run: sudo sh /private/tmp/ks/wdtest.sh

      - name: 1 tokens
        timeout-minutes: 3
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t1-token.sh

      - name: 2 anchor reachability
        timeout-minutes: 4
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t2-anchor.sh

      - name: 3 policy
        timeout-minutes: 8
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t3-policy.sh

      - name: 3b v6 anomalies
        timeout-minutes: 5
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t3b-v6.sh

      - name: 4 state revocation
        timeout-minutes: 5
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t4-states.sh

      - name: 5 restart
        timeout-minutes: 5
        continue-on-error: true
        run: sudo env PY="$PY" sh /private/tmp/ks/t5-restart.sh

      - name: reset
        if: always()
        timeout-minutes: 2
        run: sudo sh -c '. /private/tmp/ks/lib.sh; reset_all final; disarm_watchdog; pfctl -s info | head -3; pfctl -s References'

      - name: results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            sudo cat /private/tmp/ks/out/results.txt 2>/dev/null || echo 'нет результатов'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sudo cat /private/tmp/ks/out/results.txt 2>/dev/null || true
          mkdir -p out && sudo cp -R /private/tmp/ks/out/. out/ && sudo chown -R "$USER" out

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spike-pf-${{ matrix.os }}
          path: out/
