name: smoke-darwin

# Дымовой прогон pf-backend на одноразовых macOS-раннерах. Правила pf ставятся только здесь, на ВМ раннера.
# Живая приёмка — волна 3 (ks-ci); этот файл ks-ci поглощает или удаляет.
on:
  push:
    branches: [universal-darwin]
    paths: ['internal/backend/darwin/**', 'cmd/killswitch/**', '.github/workflows/smoke-darwin.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-darwin
  cancel-in-progress: true

jobs:
  pf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'

      - name: unit tests
        timeout-minutes: 5
        run: go test ./internal/backend/darwin/ ./cmd/killswitch/

      - name: build
        timeout-minutes: 5
        run: |
          sudo mkdir -p /private/tmp/ks-smoke/out
          go build -o killswitch ./cmd/killswitch
          go test -c -tags darwinlive -o live.test ./internal/backend/darwin
          sudo cp killswitch live.test internal/backend/darwin/testdata/smoke/*.sh internal/backend/darwin/testdata/smoke/*.py /private/tmp/ks-smoke/
          id -u | sudo tee /private/tmp/ks-smoke/runner_uid
          sudo chmod -R a+rX /private/tmp/ks-smoke

      - name: fetch sing-box (pinned sha256)
        timeout-minutes: 3
        env:
          SINGBOX_VERSION: '1.14.4'
          SHA256_ARM64: '0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838'
          SHA256_AMD64: 'eae86b9b033bba50b7c44ab719e4bfac0aca05efd28483390ed3aa510f32db25'
        run: |
          case "$(uname -m)" in arm64) arch=arm64; want=$SHA256_ARM64 ;; *) arch=amd64; want=$SHA256_AMD64 ;; esac
          name="sing-box-$SINGBOX_VERSION-darwin-$arch"
          curl -fsSL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/$name.tar.gz"
          got=$(shasum -a 256 sb.tar.gz | awk '{print $1}')
          [ "$got" = "$want" ] || { echo "sha256 mismatch: $got"; exit 1; }
          mkdir -p sb && tar -xzf sb.tar.gz -C sb
          sudo cp "sb/$name/sing-box" /private/tmp/ks-smoke/sing-box
          /private/tmp/ks-smoke/sing-box version

      - name: smoke
        timeout-minutes: 15
        run: sudo sh /private/tmp/ks-smoke/smoke.sh

      - name: reset
        if: always()
        timeout-minutes: 2
        run: sudo sh -c '. /private/tmp/ks-smoke/lib.sh; reset_all final; disarm_watchdog; pfctl -s info | head -1; pfctl -s References'

      - name: results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            sudo cat /private/tmp/ks-smoke/out/results.txt 2>/dev/null || echo 'нет результатов'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out && sudo cp -R /private/tmp/ks-smoke/out/. out/ && sudo cp /var/log/killswitch.log out/ 2>/dev/null; sudo chown -R "$USER" out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-darwin-${{ matrix.os }}
          path: out/
