# Спайк WFP (волна 0 эпика universal): живые проверки только на одноразовом раннере.
name: spike-wfp

on:
  push:
    branches: [universal-spike-wfp]
    paths:
      - 'spike/wfp/**'
      - '.github/workflows/spike-wfp.yml'

permissions:
  contents: read

concurrency:
  group: spike-wfp
  cancel-in-progress: true

env:
  SINGBOX_VERSION: '1.14.4'
  SINGBOX_SHA256: '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df'
  KS_RESULTS: 'C:\ks\results.txt'

jobs:
  spike:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: spike/wfp/go.sum

      - name: Unit tests and build
        working-directory: spike/wfp
        timeout-minutes: 5
        run: |
          go vet ./...
          go test ./...
          New-Item -ItemType Directory -Force C:\ks\bin\probe-allowed, C:\ks\bin\probe-denied, C:\ks\bin\singbox | Out-Null
          go build -o C:\ks\bin\wfpspike.exe .
          Copy-Item C:\ks\bin\wfpspike.exe C:\ks\bin\probe-allowed\
          Copy-Item C:\ks\bin\wfpspike.exe C:\ks\bin\probe-denied\
          Copy-Item singbox.json C:\ks\bin\
          C:\ks\bin\wfpspike.exe render

      - name: Fetch sing-box (pinned sha256)
        timeout-minutes: 3
        run: |
          $zip = "C:\ks\sing-box.zip"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:SINGBOX_SHA256) { throw "sha256 mismatch: $h" }
          Expand-Archive $zip C:\ks\sb
          Copy-Item C:\ks\sb\*\sing-box.exe C:\ks\bin\singbox\
          C:\ks\bin\singbox\sing-box.exe version
          C:\ks\bin\singbox\sing-box.exe check -c C:\ks\bin\singbox.json

      - name: T0 inventory (no filters)
        timeout-minutes: 3
        run: |
          . spike/wfp/ci.ps1
          "runner: $env:ImageOS $env:ImageVersion"
          [System.Environment]::OSVersion.VersionString
          $rows = Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
            Where-Object { $_.RemoteAddress -notmatch '^(127\.|::1$)' } |
            ForEach-Object { $p = Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue
              [pscustomobject]@{ Name = $p.ProcessName; Path = $p.Path; RemotePort = $_.RemotePort } }
          $rows | Sort-Object Path, RemotePort -Unique | Format-Table -AutoSize | Out-String -Width 300
          Get-Process -Name 'Runner.*', 'Provisioner*' -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path -AutoSize | Out-String -Width 300
          $paths = @($rows.Path) + @((Get-Process -Name 'Runner.*' -ErrorAction SilentlyContinue).Path) + "$env:SystemRoot\System32\svchost.exe" |
            Where-Object { $_ -and $_ -notlike 'C:\ks\*' } | Sort-Object -Unique
          $paths | Set-Content C:\ks\bin\runner-apps.txt
          "runner-apps (permit по app-id):"; $paths
          Get-NetIPAddress -AddressFamily IPv6 | Where-Object PrefixOrigin -ne 'WellKnown' | Format-Table InterfaceAlias, IPAddress, PrefixOrigin -AutoSize | Out-String
          Get-NetRoute -DestinationPrefix '::/0' -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultInboundAction, DefaultOutboundAction -AutoSize | Out-String
          Get-Service BFE, mpssvc | Format-Table Name, Status, StartType -AutoSize | Out-String
          (Get-Service BFE).DependentServices | Format-Table Name, Status -AutoSize | Out-String
          C:\ks\bin\wfpspike.exe inventory

      - name: T1 layers, loopback, app-id, LUID, soft/hard
        timeout-minutes: 5
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T1'
          C:\ks\bin\wfpspike.exe t1

      - name: T2 Windows Defender Firewall allow vs our block
        timeout-minutes: 6
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T2'
          Arm-Watchdog 7
          C:\ks\bin\wfpspike.exe t2
          Disarm-Watchdog
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultOutboundAction -AutoSize | Out-String

      - name: T4 open flows across block
        timeout-minutes: 5
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T4'
          C:\ks\bin\wfpspike.exe t4

      - name: T3 sing-box TUN strict_route, both orders
        timeout-minutes: 8
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T3'
          C:\ks\bin\wfpspike.exe t3
          Get-NetAdapter -IncludeHidden | Format-Table Name, InterfaceDescription, Status, ifIndex -AutoSize | Out-String -Width 200

      - name: T5a transactions, dynamic vs persistent
        timeout-minutes: 4
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T5a'
          C:\ks\bin\wfpspike.exe t5-tx

      - name: T5b persistent + boot-time, visibility, remove by provider GUID
        timeout-minutes: 6
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T5b'
          Arm-Watchdog 7
          C:\ks\bin\wfpspike.exe t5-setup
          "--- state из нового процесса"
          C:\ks\bin\wfpspike.exe state
          $n = Snapshot-Netsh 'setup'
          Result 'T5.netsh.boottimepolicy' 'INFO' "ks-spike в boottimepolicy: $($n.Boot); в filters: $($n.Filters)"
          C:\ks\bin\wfpspike.exe remove
          "--- state после remove"
          C:\ks\bin\wfpspike.exe state
          $n = Snapshot-Netsh 'removed'
          Result 'T5.netsh.after-remove' $(if ($n.Boot -eq 0 -and $n.Filters -eq 0) { 'PASS' } else { 'FAIL' }) "boottimepolicy: $($n.Boot); filters: $($n.Filters)"
          Expect 'T5.after-remove.denied-http' $true (Probe $Denied http '1.1.1.1:80')
          Disarm-Watchdog

      - name: T5c BFE restart with persistent + boot-time (last, may cut the runner)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          . spike/wfp/ci.ps1; Summary-Header 'T5c'
          Arm-Watchdog 9
          C:\ks\bin\wfpspike.exe t5-setup
          $m = Start-Process -FilePath $Exe -ArgumentList 'marker' -PassThru -NoNewWindow
          Start-Sleep 2
          C:\ks\bin\wfpspike.exe state
          $deps = (Get-Service BFE).DependentServices | Where-Object Status -eq 'Running'
          Result 'T5.bfe.running-dependents' 'INFO' (($deps.Name) -join ',')
          $t0 = Get-Date
          try {
            Stop-Service BFE -Force -ErrorAction Stop
            Result 'T5.bfe.stop' 'INFO' "BFE: $((Get-Service BFE).Status) за $([int]((Get-Date)-$t0).TotalMilliseconds) мс"
          } catch {
            Result 'T5.bfe.stop' 'INFO' "не остановилась: $($_.Exception.Message)"
          }
          $stopped = (Get-Service BFE).Status -eq 'Stopped'
          if ($stopped) {
            Result 'T5.bfe.stopped.denied' 'INFO' ((Probe $Denied http '1.1.1.1:80') | ConvertTo-Json -Compress)
            Result 'T5.bfe.stopped.allowed' 'INFO' ((Probe $Allowed http '1.1.1.1:80') | ConvertTo-Json -Compress)
          }
          Start-Service BFE
          foreach ($d in $deps) { Start-Service $d.Name -ErrorAction SilentlyContinue }
          (Get-Service BFE, mpssvc) | Format-Table Name, Status -AutoSize | Out-String
          Start-Sleep 3
          "--- state после перезапуска BFE"
          C:\ks\bin\wfpspike.exe state
          Expect 'T5.bfe.after.denied-blocked' $false (Probe $Denied http '1.1.1.1:80')
          Expect 'T5.bfe.after.allowed' $true (Probe $Allowed http '1.1.1.1:80')
          $n = Snapshot-Netsh 'after-bfe'
          Result 'T5.bfe.after.netsh' 'INFO' "boottimepolicy: $($n.Boot); filters: $($n.Filters)"
          if ($m -and -not $m.HasExited) { $m.Kill() }
          C:\ks\bin\wfpspike.exe remove
          C:\ks\bin\wfpspike.exe state
          Expect 'T5.bfe.after-remove.denied-http' $true (Probe $Denied http '1.1.1.1:80')
          Disarm-Watchdog

      - name: Cleanup
        if: always()
        timeout-minutes: 3
        run: |
          Unregister-ScheduledTask -TaskName ks-spike-watchdog -Confirm:$false -ErrorAction SilentlyContinue
          if (Test-Path C:\ks\bin\wfpspike.exe) { C:\ks\bin\wfpspike.exe cleanup }
          netsh wfp show filters file=C:\ks\filters-final.xml | Out-Null
          if (Test-Path $env:KS_RESULTS) { Get-Content $env:KS_RESULTS }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-wfp-evidence
          path: |
            C:\ks\results.txt
            C:\ks\bin\*.log
            C:\ks\*.xml
            C:\ks\wdf-profiles.csv
          if-no-files-found: warn
          retention-days: 30
