# CI killswitch: формат и vet, юнит- и эталонные тесты на трёх ОС, релизные бинарники с sha256 (артефакт, без Release),
# живые сценарии на одноразовых раннерах Windows и macOS. Правила WFP и pf ставятся только на этих ВМ.
name: ci

on:
  push:
    branches: [universal, main, universal-ci]
  pull_request:
    branches: [universal, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  SINGBOX_VERSION: '1.14.4'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "не отформатировано:"; echo "$out"; exit 1; fi
      - name: vet (linux, windows, darwin, live tags)
        run: |
          set -e
          for os in linux windows darwin; do echo "== vet $os"; GOOS=$os go vet ./...; done
          echo "== vet windows wfplive"; GOOS=windows go vet -tags wfplive ./...
          echo "== vet darwin darwinlive"; GOOS=darwin go vet -tags darwinlive ./...
      - name: sh -n
        run: for f in ci/darwin/*.sh; do sh -n "$f" && echo "ok $f"; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: unit and golden tests
        run: go test ./...

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build x5
        env:
          CGO_ENABLED: '0'
        run: |
          set -e
          mkdir -p dist/release
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/release/killswitch-$os-$arch$ext" ./cmd/killswitch
          done
          cd dist/release && sha256sum killswitch-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: killswitch-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error

  live-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      KS: 'C:\ks'
      KS_CONFIG: 'C:\ProgramData\killswitch\config.toml'
      KS_BOOTKEYS: 'C:\ks\bootkeys.txt'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: build
        timeout-minutes: 6
        run: |
          New-Item -ItemType Directory -Force "$env:KS\probe-allowed", "$env:KS\probe-denied", "$env:KS\probe-other", 'C:\ProgramData\killswitch' | Out-Null
          go build -o "$env:KS\killswitch.exe" ./cmd/killswitch
          if ($LASTEXITCODE) { throw "build: $LASTEXITCODE" }
          go test -tags wfplive -c -o "$env:KS\live.test.exe" ./internal/backend/windows
          if ($LASTEXITCODE) { throw "build live: $LASTEXITCODE" }
          foreach ($d in 'probe-allowed', 'probe-denied', 'probe-other') { Copy-Item "$env:SystemRoot\System32\curl.exe" "$env:KS\$d\" }

      - name: config (runner by app-id) and watchdog
        timeout-minutes: 2
        run: |
          $paths = @((Get-Process -Name 'Runner.*' -ErrorAction SilentlyContinue).Path)
          $paths += Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
            Where-Object { $_.RemoteAddress -notmatch '^(127\.|::1$)' } |
            ForEach-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path }
          $paths = $paths | Where-Object { $_ -and $_ -notmatch '\\svchost\.exe$' -and $_ -notlike "$env:KS\*" } | Sort-Object -Unique
          "доверенные по app-id:"; $paths
          $trust = ($paths + "$env:KS\probe-allowed\curl.exe" | ForEach-Object { "[[trust]]`nkind = 'program'`nvalue = '$_'`n" }) -join "`n"
          @"
          lan = true
          [tunnel]
          interfaces = ['ks-smoke-no-tunnel']
          [repair]
          programs = ['$env:KS\probe-denied\curl.exe']
          $trust
          "@ | Set-Content $env:KS_CONFIG
          Get-Content $env:KS_CONFIG
          $a = New-ScheduledTaskAction -Execute "$env:KS\killswitch.exe" -Argument 'uninstall'
          $t = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(25)
          Register-ScheduledTask -TaskName ks-ci-watchdog -Action $a -Trigger $t -User 'NT AUTHORITY\SYSTEM' -RunLevel Highest -Force | Out-Null
          & "$env:KS\killswitch.exe" plan

      - name: live scenarios
        timeout-minutes: 15
        run: ./ci/windows/live.ps1

      - name: cleanup
        if: always()
        timeout-minutes: 3
        run: |
          Stop-Service killswitch -Force -ErrorAction SilentlyContinue
          sc.exe delete killswitch | Out-Null
          & "$env:KS\killswitch.exe" uninstall
          Unregister-ScheduledTask -TaskName ks-ci-watchdog -Confirm:$false -ErrorAction SilentlyContinue
          Get-Content "$env:KS\results.txt" -ErrorAction SilentlyContinue

  live-darwin:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: build
        timeout-minutes: 5
        run: |
          sudo mkdir -p /private/tmp/ks-smoke/out
          go build -o killswitch ./cmd/killswitch
          go test -c -tags darwinlive -o live.test ./internal/backend/darwin
          sudo cp killswitch live.test ci/darwin/*.sh ci/targets.py /private/tmp/ks-smoke/
          id -u | sudo tee /private/tmp/ks-smoke/runner_uid
          sudo chmod -R a+rX /private/tmp/ks-smoke

      - name: fetch sing-box (pinned sha256)
        timeout-minutes: 3
        env:
          SHA256_ARM64: '0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838'
          SHA256_AMD64: 'eae86b9b033bba50b7c44ab719e4bfac0aca05efd28483390ed3aa510f32db25'
        run: |
          case "$(uname -m)" in arm64) arch=arm64; want=$SHA256_ARM64 ;; *) arch=amd64; want=$SHA256_AMD64 ;; esac
          name="sing-box-$SINGBOX_VERSION-darwin-$arch"
          curl -fsSL -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v$SINGBOX_VERSION/$name.tar.gz"
          got=$(shasum -a 256 sb.tar.gz | awk '{print $1}')
          [ "$got" = "$want" ] || { echo "sha256 mismatch: $got"; exit 1; }
          mkdir -p sb && tar -xzf sb.tar.gz -C sb
          sudo cp "sb/$name/sing-box" /private/tmp/ks-smoke/sing-box
          /private/tmp/ks-smoke/sing-box version

      - name: live scenarios
        timeout-minutes: 15
        run: sudo sh /private/tmp/ks-smoke/live.sh

      - name: reset
        if: always()
        timeout-minutes: 2
        run: sudo sh -c '. /private/tmp/ks-smoke/lib.sh; reset_all final; disarm_watchdog; pfctl -s info | head -1; pfctl -s References'

      - name: results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            sudo cat /private/tmp/ks-smoke/out/results.txt 2>/dev/null || echo 'нет результатов'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out && sudo cp -R /private/tmp/ks-smoke/out/. out/ && sudo cp /var/log/killswitch.log out/ 2>/dev/null; sudo chown -R "$USER" out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-darwin-${{ matrix.os }}
          path: out/
