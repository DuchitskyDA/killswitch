# Дым backend WFP (ks-windows, волна 2): только на одноразовом раннере windows-2025. Живая приёмка — волна 3 (ks-ci).
# Раннер разрешён по app-id (Runner.Listener/Worker и процессы с открытыми соединениями до on), пробы — копии curl.exe.
# Сторож: задача SYSTEM снимает всё через 25 минут; последний шаг (always) снимает всё сразу.
name: smoke-windows

on:
  push:
    branches: [universal-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-windows
  cancel-in-progress: true

env:
  KS: 'C:\ks'
  KS_CONFIG: 'C:\ProgramData\killswitch\config.toml'

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Unit tests and build
        timeout-minutes: 6
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw "go vet: $LASTEXITCODE" }
          # cmd/killswitch здесь не гоняется: его TestBackendNotImplementedIsApplyError вызывает настоящий backend.
          go test ./internal/backend/windows ./internal/third_party/wf
          if ($LASTEXITCODE) { throw "go test: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force "$env:KS\probe-allowed", "$env:KS\probe-denied", "$env:KS\probe-other", 'C:\ProgramData\killswitch' | Out-Null
          go build -o "$env:KS\killswitch.exe" ./cmd/killswitch
          go test -tags wfplive -c -o "$env:KS\live.test.exe" ./internal/backend/windows
          if ($LASTEXITCODE) { throw "build live: $LASTEXITCODE" }
          foreach ($d in 'probe-allowed', 'probe-denied', 'probe-other') { Copy-Item "$env:SystemRoot\System32\curl.exe" "$env:KS\$d\" }

      - name: Smoke helpers
        timeout-minutes: 1
        run: |
          @'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $KsExe = "$env:KS\killswitch.exe"
          $InstalledExe = "$env:ProgramFiles\killswitch\killswitch.exe"
          $script:Fails = 0
          function Result($id, $ok, $detail) {
              $st = 'PASS'
              if (-not $ok) { $st = 'FAIL'; $script:Fails++ }
              Write-Host "RESULT $id $st $detail"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $id | $st | $($detail -replace '\|', '/') |"
          }
          function Expect-Code($id, $want, [scriptblock]$cmd) {
              $out = & $cmd 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              Result $id ($code -eq $want) "code=$code want=$want"
          }
          function Expect-Output($id, $pattern, [scriptblock]$cmd) {
              $out = & $cmd 2>&1 | Out-String
              Write-Host $out
              Result $id ($out.Contains($pattern)) "want '$pattern'"
          }
          function Expect-Probe($id, $wantOk, $dir, $url) {
              & "$env:KS\$dir\curl.exe" -s -o NUL -m 6 $url 2>&1 | Out-Null
              $code = $LASTEXITCODE
              Result $id (($code -eq 0) -eq $wantOk) "curl=$code want-ok=$wantOk"
          }
          function Assert-Results {
              if ($script:Fails -gt 0) { throw "FAIL: $script:Fails" }
              $global:LASTEXITCODE = 0 # ожидаемо упавшая проба не должна ронять шаг
          }
          '@ | Set-Content "$env:KS\smoke.ps1" -Encoding utf8

      - name: Config (runner by app-id) and watchdog
        timeout-minutes: 2
        run: |
          $paths = @((Get-Process -Name 'Runner.*' -ErrorAction SilentlyContinue).Path)
          $paths += Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue |
            Where-Object { $_.RemoteAddress -notmatch '^(127\.|::1$)' } |
            ForEach-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path }
          $paths = $paths | Where-Object { $_ -and $_ -notmatch '\\svchost\.exe$' -and $_ -notlike "$env:KS\*" } | Sort-Object -Unique
          "доверенные по app-id:"; $paths
          $trust = ($paths + "$env:KS\probe-allowed\curl.exe" | ForEach-Object { "[[trust]]`nkind = 'program'`nvalue = '$_'`n" }) -join "`n"
          @"
          lan = true
          [tunnel]
          interfaces = ['ks-smoke-no-tunnel']
          [repair]
          programs = ['$env:KS\probe-denied\curl.exe']
          $trust
          "@ | Set-Content $env:KS_CONFIG
          Copy-Item $env:KS_CONFIG "$env:KS\config.toml"
          Get-Content $env:KS_CONFIG
          $a = New-ScheduledTaskAction -Execute "$env:KS\killswitch.exe" -Argument 'uninstall'
          $t = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(25)
          Register-ScheduledTask -TaskName ks-smoke-watchdog -Action $a -Trigger $t -User 'NT AUTHORITY\SYSTEM' -RunLevel Highest -Force | Out-Null
          & "$env:KS\killswitch.exe" plan

      - name: on — probe blocked, allowed program and loopback pass
        timeout-minutes: 4
        run: |
          . "$env:KS\smoke.ps1"
          Expect-Code 'on' 0 { & $KsExe on }
          Expect-Code 'status' 0 { & $KsExe status }
          Expect-Probe 'denied-blocked' $false 'probe-denied' 'http://1.1.1.1/'
          Expect-Probe 'allowed-passes' $true 'probe-allowed' 'http://1.1.1.1/'
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          Expect-Probe 'loopback-passes' $true 'probe-denied' 'http://127.0.0.1:8765/'
          Stop-Process $srv -ErrorAction SilentlyContinue
          Assert-Results

      - name: evidence — drop event of our filter
        timeout-minutes: 3
        run: |
          & "$env:KS\live.test.exe" '-test.run=^TestLiveEvidence$' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw "TestLiveEvidence: $LASTEXITCODE" }

      - name: off and repair (after the CLI process exits)
        timeout-minutes: 4
        run: |
          . "$env:KS\smoke.ps1"
          Expect-Code 'off' 0 { & $KsExe off }
          Expect-Output 'status-off' 'режим=off' { & $KsExe status }
          Expect-Probe 'off-denied-passes' $true 'probe-denied' 'http://1.1.1.1/'
          Expect-Code 'repair' 0 { & $KsExe repair }
          Expect-Output 'status-repair' 'режим=repair' { & $KsExe status }
          Expect-Probe 'repair-listed-blocked' $false 'probe-denied' 'http://1.1.1.1/'
          Expect-Probe 'repair-other-passes' $true 'probe-other' 'http://1.1.1.1/'
          Expect-Code 'on-again' 0 { & $KsExe on }
          Expect-Probe 'on-again-other-blocked' $false 'probe-other' 'http://1.1.1.1/'
          Assert-Results

      - name: check — no tunnel and no targets is INCONCLUSIVE (5)
        timeout-minutes: 3
        run: |
          . "$env:KS\smoke.ps1"
          Expect-Code 'check' 5 { & $KsExe check }
          Assert-Results

      - name: tie 0xFFFF — foreign sublayer before ours is LEAK
        timeout-minutes: 3
        run: |
          & "$env:KS\live.test.exe" '-test.run=^TestLiveTie$' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw "TestLiveTie: $LASTEXITCODE" }
          . "$env:KS\smoke.ps1"
          Expect-Code 'status-after-tie' 0 { & $KsExe status }
          Assert-Results

      - name: service enforce survives its restart
        timeout-minutes: 4
        run: |
          . "$env:KS\smoke.ps1"
          Expect-Code 'install' 0 { & ./dist/windows/menu.ps1 -Action install -Source "$env:KS\killswitch.exe" }
          (Get-Service killswitch).Status
          Restart-Service killswitch
          Start-Sleep 5
          Expect-Output 'service-running' 'Running' { (Get-Service killswitch).Status }
          Expect-Output 'status-on' 'режим=on' { & $InstalledExe status }
          Expect-Probe 'service-denied-blocked' $false 'probe-denied' 'http://1.1.1.1/'
          netsh wfp show boottimepolicy file="$env:KS\boottime-on.xml" | Out-Null
          Expect-Output 'boottime-present' 'True' { (Get-Content "$env:KS\boottime-on.xml" -Raw).Contains('killswitch') }
          Assert-Results

      - name: uninstall without config removes provider, sublayer and all filters
        timeout-minutes: 4
        run: |
          . "$env:KS\smoke.ps1"
          Remove-Item $env:KS_CONFIG
          Expect-Code 'uninstall' 0 { & ./dist/windows/menu.ps1 -Action uninstall }
          Expect-Code 'gone' 0 { & "$env:KS\live.test.exe" '-test.run=^TestLiveGone$' '-test.v' }
          Expect-Probe 'after-uninstall-denied-passes' $true 'probe-denied' 'http://1.1.1.1/'
          netsh wfp show boottimepolicy file="$env:KS\boottime.xml" | Out-Null
          Expect-Output 'boottime-clean' 'False' { (Get-Content "$env:KS\boottime.xml" -Raw).Contains('killswitch') }
          Assert-Results

      - name: cleanup
        if: always()
        timeout-minutes: 3
        run: |
          Stop-Service killswitch -Force -ErrorAction SilentlyContinue
          sc.exe delete killswitch | Out-Null
          & "$env:KS\killswitch.exe" uninstall
          Unregister-ScheduledTask -TaskName ks-smoke-watchdog -Confirm:$false -ErrorAction SilentlyContinue
